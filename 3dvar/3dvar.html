<body>
	
	<!-- Spinner div -->
	<div id="loading-overlay">
		 <div class="spinner">
     </div>
    <div class="loading-text">        
		Loading datasets ...    
       </div>
    </div>




    <!-- Display the status of running App   -->
<header class="topbar">
    <!-- Logo -->
   <!-- <div class="topbar-left">
        <img src="img/logo.png" alt="PENELOP" class="topbar-logo">
    </div>-->
    <!-- Application -->
    <div class="topbar-center">
        <div class="app-subtitle">ALARO 1.3 km 3DVar Forecast</div>
    </div>
    <!-- Current UTC time -->
    <!--<div class="topbar-date"> <span id="current-date"></span> </div>-->
    
    <!-- GeoServer status -->
    <div class="topbar-status">
        <span id="server-status" class="status success">
            <span class="status-dot"></span>
            <span id="server-status-text">
                Connected to GeoServer
            </span>
        </span>
    </div>
</header>
    
    

   
  <!-- LAYERS SIDEBAR -->
 <aside class="sidebar">
 <div class="sidebar-header">       
 
  <label style="font-size:16px; margin-top:25px;color:#FFFFFF !Important;font-style: bold !Important; "><span> LAYER OPACITY </span></label>
    </div>
            <div class="opacity-control">			
                <input id="opacity-slider" type="range" min="0" max="100" value="100">                
                <span  id="opacity-value">100%</span>                	 
            </div> 
                       	 
<label class="panel-label" style="font-size:16px;margin-bottom:10px;color:#FFFFFF !Important; "><span> OVERLAY </span>	     </label>
<div class="overlay-list">
    <!--<label><input type="checkbox" id="overlay-mslp"    class="overlay-checkbox"> MSLP</label>-->
    <label style="font-size:14px;color:#FFFFFF !Important; font-style: bold !Important"><input type="checkbox" id="overlay-regions"  class="overlay-checkbox" style="font-size:18px ; "> Regions</label>
    <label style="font-size:14px;color:#FFFFFF !Important; font-style: bold !Important"><input type="checkbox" id="overlay-rmi_stat" class="overlay-checkbox" style="font-size:18px ; "> RMI_AWS stations</label>
</div>
    <div id="layers-container">
        <nav id="menu-container"></nav>
    </div>

</aside>   

    

    <!-- MAP -->
    <main id="map">
    <section class="timeline-container"  id="timeline-id">
    <!-- toolbar -->
    <div class="timeline-toolbar">
        <div class="timeline-buttons">
            <!-- Btn   (prev) -->
            <button class="time-btn prev" aria-label="Previous">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                </svg>
            </button>

            <!-- Btn  (play) -->
            <button class="time-btn play" aria-label="Play">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            
            <!-- Btn  (next) -->
            <button class="time-btn next" aria-label="Next">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6zm10-12h2v12h-2z"/>
                </svg>
            </button>
        </div>
    </div> <!-- toolbar -->
    
    <!-- Current date -->
    <div class="timeline-info">
        <span class="timeline-date"></span>
        <span class="timeline-separator">•</span>
        <span class="timeline-hour"></span>
    </div>
        <input class="time-slider" type="range" min="0" max="0" value="0">
    </div>
    <div class="time-tooltip"></div>
</section>  
</main>
