<body>


<body>


<body>
	
	<!-- Spinner div -->
    <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">
        Loading BEHRA datasets ...
    </div>
    </div>


    <!-- Display the status of running App   -->
<header class="topbar">
    <!-- Logo -->
   <!-- <div class="topbar-left">
        <img src="img/logo.png" alt="PENELOP" class="topbar-logo">
    </div>-->
    <!-- Application -->
    <div class="topbar-center">
        <div class="app-subtitle">ALARO 1.3km REANALYSIS</div>
    </div>
    <!-- Current UTC time -->
    <!--<div class="topbar-date"> <span id="current-date"></span> </div>-->
    
    <!-- GeoServer status -->
    <div class="topbar-status">
        <span id="server-status" class="status success">
            <span class="status-dot"></span>
            <span id="server-status-text">
                Connected to GeoServer
            </span>
        </span>
    </div>
</header>
    
    



    <!-- MAP -->
    <main id="map"></main>

		<!-- DATE & TIME PANEL -->
<div class="calendar-container">
    <div id="calendar-panel">
        <div class="datetime-container">
            <div class="datetime-title" style="font-size:16px;">
                DATE 
            </div>
            <div class="calendar-wrapper">
                <input id="calendar-picker" type="text">
            </div>
            <div class="hour-selector">
                <label for="hour-select" style="font-size:16px;">
                    HOUR 
                </label>
                <select id="hour-select"></select>
            </div>
        </div>
    </div>
</div>

    <!-- LAYERS SIDEBAR -->
<aside class="sidebar">		
    <div id="display-panel" class="panel">	
				
    <!-- LAYERS SIDEBAR -->
<aside class="sidebar"   id="sidebar-container">	
    <div id="display-panel" class="panel">			
		
        <div class="panel-title">
            <!--Display-->
        </div>                
        <div class="panel-body">
            <!-- Opacity -->
            <label class="panel-label"  style="font-size:16px ;">
                LAYER OPACITY
            </label>
            <div class="opacity-control">
                <input id="opacity-slider"
                       type="range"  min="0" max="100" value="100">
                <span id="opacity-value">  100% </span>
            </div>

            <!-- Overlay -->
<label class="panel-label"> OVERLAY</label>
    <div class="overlay-list">
    <!--<label><input type="checkbox" id="overlay-mslp"    class="overlay-checkbox"> MSLP</label>-->
    <label style="font-size:14px;color:#FFFFFF !Important; font-style: bold !Important"><input type="checkbox" id="overlay-regions"  class="overlay-checkbox" style="font-size:18px ; "> Regions</label>
    <label style="font-size:14px;color:#FFFFFF !Important; font-style: bold !Important"><input type="checkbox" id="overlay-rmi_stat" class="overlay-checkbox" style="font-size:18px ; "> RMI_AWS stations</label>
</div>


    <div class="sidebar-tools"  id="layers-container">
        <nav id="menu-container" id="layers_menu"></nav>
    </div>

</aside>

    
    
</body>
